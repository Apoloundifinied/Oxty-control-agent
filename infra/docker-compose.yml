services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ia-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iacontrol
      POSTGRES_PASSWORD: iacontrol
      POSTGRES_DB: iacontrol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iacontrol -d iacontrol"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
