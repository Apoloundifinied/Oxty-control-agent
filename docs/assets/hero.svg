<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">IA-Control — mapa de agentes</title>
  <desc id="d">Cinco agentes ligados a um núcleo central. Partículas de ação seguem pelas conexões e param nos portões que pedem aprovação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b12"/><stop offset="1" stop-color="#171726"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#0a84ff" stop-opacity=".55"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="s1" d="M150,90 Q330,80 500,185"/>
    <path id="s2" d="M150,250 Q330,260 500,185"/>
    <path id="s3" d="M850,90 Q670,80 500,185"/>
    <path id="s4" d="M850,250 Q670,260 500,185"/>
    <path id="s5" d="M500,45 Q540,110 500,185"/>
    <path id="o1" d="M350,185 A150,46 0 1,1 650,185 A150,46 0 1,1 350,185 Z"/>
    <path id="o2" d="M270,185 A230,70 0 1,1 730,185 A230,70 0 1,1 270,185 Z"/>
  </defs>

  <rect width="1000" height="340" rx="24" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#fff">
    <circle cx="70" cy="40" r="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="300" r="1"><animate attributeName="opacity" values=".1;.8;.1" dur="4s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="30" r="1.1"><animate attributeName="opacity" values=".2;.9;.2" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="315" r="1.2"><animate attributeName="opacity" values=".1;.8;.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="45" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="3.2s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="200" r="1.2"><animate attributeName="opacity" values=".1;.7;.1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="190" r="1"><animate attributeName="opacity" values=".1;.8;.1" dur="3.8s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="4.2s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- órbitas -->
  <g transform="rotate(-18 500 185)" fill="none" stroke="#64d2ff" stroke-opacity=".22">
    <use xlink:href="#o1" href="#o1"/>
    <circle r="4" fill="#64d2ff" stroke="none" filter="url(#g)"><animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#o1" href="#o1"/></animateMotion></circle>
  </g>
  <g transform="rotate(14 500 185)" fill="none" stroke="#bf5af2" stroke-opacity=".18">
    <use xlink:href="#o2" href="#o2"/>
    <circle r="3.5" fill="#bf5af2" stroke="none" filter="url(#g)"><animateMotion dur="15s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#o2" href="#o2"/></animateMotion></circle>
  </g>

  <!-- conexões -->
  <g fill="none" stroke="#3a3a58" stroke-width="1.5" stroke-linecap="round">
    <use xlink:href="#s1" href="#s1"/><use xlink:href="#s2" href="#s2"/><use xlink:href="#s3" href="#s3"/><use xlink:href="#s4" href="#s4"/><use xlink:href="#s5" href="#s5"/>
  </g>

  <!-- portões: verde = autônomo, âmbar = aprovação, roxo = dupla -->
  <g stroke-width="2" fill="#0b0b12">
    <rect x="-6" y="-6" width="12" height="12" rx="3" stroke="#30d158" transform="translate(327.5 108.75) rotate(45)"/>
    <rect x="-6" y="-6" width="12" height="12" rx="3" stroke="#ff9f0a" transform="translate(327.5 238.75) rotate(45)"><animate attributeName="stroke-width" values="2;4.5;2" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="3" stroke="#bf5af2" transform="translate(672.5 108.75) rotate(45)"/>
    <rect x="-6" y="-6" width="12" height="12" rx="3" stroke="#30d158" transform="translate(672.5 238.75) rotate(45)"/>
    <rect x="-6" y="-6" width="12" height="12" rx="3" stroke="#ff9f0a" transform="translate(520 111.25) rotate(45)"><animate attributeName="stroke-width" values="2;4.5;2" dur="1.6s" begin=".6s" repeatCount="indefinite"/></rect>
  </g>

  <!-- partículas de ação -->
  <circle r="3.6" fill="#30d158" filter="url(#g)"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath xlink:href="#s1" href="#s1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.4s" repeatCount="indefinite"/></circle>
  <!-- para no portão (aguardando você) e segue após aprovação -->
  <circle r="3.6" fill="#ff9f0a" filter="url(#g)"><animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;.5;.5;1" keyTimes="0;.4;.75;1"><mpath xlink:href="#s2" href="#s2"/></animateMotion></circle>
  <circle r="3.6" fill="#5ac8fa" filter="url(#g)"><animateMotion dur="3.8s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#s3" href="#s3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.8s" begin="1s" repeatCount="indefinite"/></circle>
  <!-- bate no portão e volta (bloqueada) -->
  <circle r="3.6" fill="#ff453a" filter="url(#g)"><animateMotion dur="4s" begin=".5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;.5;0" keyTimes="0;.5;1"><mpath xlink:href="#s4" href="#s4"/></animateMotion></circle>
  <circle r="3.6" fill="#bf5af2" filter="url(#g)"><animateMotion dur="5s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;.5;.5;1" keyTimes="0;.4;.75;1"><mpath xlink:href="#s5" href="#s5"/></animateMotion></circle>

  <!-- núcleo -->
  <circle cx="500" cy="185" r="70" fill="url(#halo)"><animate attributeName="r" values="64;76;64" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="185" r="30" fill="#0a84ff" filter="url(#g)"><animate attributeName="r" values="29;32;29" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="185" r="44" fill="none" stroke="#64d2ff" stroke-opacity=".55" stroke-dasharray="3 9" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 500 185" to="360 500 185" dur="24s" repeatCount="indefinite"/></circle>
  <text x="500" y="244" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" letter-spacing="3" fill="#8e8e93">IA-CONTROL</text>

  <!-- agentes -->
  <g font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#d1d1d6" text-anchor="middle">
    <g transform="translate(150 90)"><circle r="20" fill="#30d158" fill-opacity=".16" stroke="#30d158"><animate attributeName="r" values="20;24;20" dur="3.4s" repeatCount="indefinite"/></circle><circle r="7" fill="#30d158" filter="url(#g)"/><text y="40">Atendimento</text></g>
    <g transform="translate(150 250)"><circle r="20" fill="#ff9f0a" fill-opacity=".16" stroke="#ff9f0a"><animate attributeName="r" values="20;24;20" dur="1.6s" repeatCount="indefinite"/></circle><circle r="7" fill="#ff9f0a" filter="url(#g)"/><text y="40">Cobrança</text></g>
    <g transform="translate(850 90)"><circle r="20" fill="#5ac8fa" fill-opacity=".16" stroke="#5ac8fa"/><circle r="7" fill="#5ac8fa" filter="url(#g)"/><text y="40">Financeiro</text></g>
    <g transform="translate(850 250)"><circle r="20" fill="#ff375f" fill-opacity=".16" stroke="#ff375f"/><circle r="7" fill="#ff375f" filter="url(#g)"/><text y="40">Redes sociais</text></g>
    <g transform="translate(500 45)"><circle r="20" fill="#bf5af2" fill-opacity=".16" stroke="#bf5af2"><animate attributeName="r" values="20;24;20" dur="2.2s" repeatCount="indefinite"/></circle><circle r="7" fill="#bf5af2" filter="url(#g)"/><text x="52" y="4" text-anchor="start">E-mail</text></g>
  </g>
</svg>
